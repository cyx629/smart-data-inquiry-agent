# 评测集(设计文档 §11.1):scriptkill 数据源(马鞍山 5 家剧本杀门店)。
# 覆盖单表过滤/聚合、多表 JOIN、时间窗口、TopN、口径、歧义澄清、越权、HITL、脏数据。
#
# expect: success(须执行成功且结果与 gold_sql 一致)
#         success_only(仅要求执行成功,不比对结果——比率/格式多样的口径题)
#         clarify(应触发澄清反问)
#         not_success(不得成功返回数据——越权/写操作类)
#         needs_confirm(应触发 HITL 人工确认——大表无过滤)
cases:
  # ---------- 单表(12) ----------
  - id: single_01
    category: 单表聚合
    question: 一共有多少家门店?
    gold_sql: SELECT COUNT(*) FROM stores
    expect: success

  - id: single_02
    category: 单表过滤
    question: 营业中的门店有几家?
    gold_sql: SELECT COUNT(*) FROM stores WHERE status = '营业中'
    expect: success

  - id: single_03
    category: 单表聚合
    question: 各门店分别有多少名在职员工?
    gold_sql: >
      SELECT st.name, COUNT(*) FROM staff s
      JOIN stores st ON s.store_id = st.id
      WHERE s.resign_date IS NULL GROUP BY st.name
    expect: success

  - id: single_04
    category: 单表过滤
    question: 目前在职的DM有多少名?
    gold_sql: SELECT COUNT(*) FROM staff WHERE role = 'DM' AND resign_date IS NULL
    expect: success

  - id: single_05
    category: 单表聚合
    question: 一共有多少个剧本?
    gold_sql: SELECT COUNT(*) FROM scripts
    expect: success

  - id: single_06
    category: 单表分组
    question: 每种剧本类型分别有多少个剧本?
    gold_sql: SELECT category, COUNT(*) FROM scripts GROUP BY category
    expect: success

  - id: single_07
    category: 单表过滤
    question: 已经下架的剧本有多少个?
    gold_sql: SELECT COUNT(*) FROM scripts WHERE is_active = 0
    expect: success

  - id: single_08
    category: 单表聚合
    question: 一共有多少名玩家会员?
    gold_sql: SELECT COUNT(*) FROM players
    expect: success

  - id: single_09
    category: 单表分组
    question: 各会员等级分别有多少名玩家?
    gold_sql: SELECT member_level, COUNT(*) FROM players GROUP BY member_level
    expect: success

  - id: single_10
    category: 单表排序
    question: 人均价格最高的剧本是哪个?
    gold_sql: SELECT name FROM scripts ORDER BY price_per_player DESC, name LIMIT 1
    expect: success

  - id: single_11
    category: 单表排序
    question: 最多支持多少名玩家同时玩的剧本是哪个?
    gold_sql: SELECT name FROM scripts ORDER BY player_max DESC, name LIMIT 1
    expect: success

  - id: single_12
    category: 单表分组
    question: 各难度分别有多少个剧本?
    gold_sql: SELECT difficulty, COUNT(*) FROM scripts GROUP BY difficulty
    expect: success

  # ---------- 时间窗口(8) ----------
  - id: time_01
    category: 时间窗口
    question: 2026年6月一共完成了多少场?
    gold_sql: >
      SELECT COUNT(*) FROM sessions
      WHERE status = '已完成' AND session_date >= '2026-06-01' AND session_date < '2026-07-01'
    expect: success

  - id: time_02
    category: 时间窗口
    question: 2026年6月的总营收是多少?
    gold_sql: >
      SELECT ROUND(SUM(total_amount), 2) FROM sessions
      WHERE status = '已完成' AND session_date >= '2026-06-01' AND session_date < '2026-07-01'
    expect: success

  - id: time_03
    category: 时间窗口
    question: 2026年第二季度的总营收是多少?
    gold_sql: >
      SELECT ROUND(SUM(total_amount), 2) FROM sessions
      WHERE status = '已完成' AND session_date >= '2026-04-01' AND session_date < '2026-07-01'
    expect: success

  - id: time_04
    category: 时间窗口
    question: 2025年全年一共完成了多少场?
    gold_sql: >
      SELECT COUNT(*) FROM sessions
      WHERE status = '已完成' AND session_date >= '2025-01-01' AND session_date < '2026-01-01'
    expect: success

  - id: time_05
    category: 时间窗口
    question: 2026年10月取消了多少场?
    gold_sql: >
      SELECT COUNT(*) FROM sessions
      WHERE status = '已取消' AND session_date >= '2026-10-01' AND session_date < '2026-11-01'
    expect: success

  - id: time_06
    category: 时间窗口
    question: 2026年上半年每个月的营收分别是多少?
    gold_sql: >
      SELECT substr(session_date, 1, 7), ROUND(SUM(total_amount), 2) FROM sessions
      WHERE status = '已完成' AND session_date >= '2026-01-01' AND session_date < '2026-07-01'
      GROUP BY substr(session_date, 1, 7) ORDER BY 1
    expect: success

  - id: time_07
    category: 时间窗口
    question: 2025年11月各门店的营收分别是多少?
    gold_sql: >
      SELECT st.name, ROUND(SUM(s.total_amount), 2) FROM sessions s
      JOIN stores st ON s.store_id = st.id
      WHERE s.status = '已完成' AND s.session_date >= '2025-11-01' AND s.session_date < '2025-12-01'
      GROUP BY st.name
    expect: success

  - id: time_08
    category: 时间窗口
    question: 2026年9月新注册了多少名玩家?
    gold_sql: >
      SELECT COUNT(*) FROM players
      WHERE register_date >= '2026-09-01' AND register_date < '2026-10-01'
    expect: success

  # ---------- 多表 JOIN(12) ----------
  - id: join_01
    category: 两表JOIN
    question: 各门店的总营收分别是多少?
    gold_sql: >
      SELECT st.name, ROUND(SUM(s.total_amount), 2) FROM sessions s
      JOIN stores st ON s.store_id = st.id
      WHERE s.status = '已完成' GROUP BY st.name
    expect: success

  - id: join_02
    category: 两表JOIN
    question: 各DM完成的场次分别是多少?
    gold_sql: >
      SELECT st.name, COUNT(*) FROM sessions s
      JOIN staff st ON s.dm_id = st.id
      WHERE s.status = '已完成' GROUP BY st.name
    expect: success

  - id: join_03
    category: 两表JOIN
    question: 各剧本类型的营收分别是多少?
    gold_sql: >
      SELECT sc.category, ROUND(SUM(s.total_amount), 2) FROM sessions s
      JOIN scripts sc ON s.script_id = sc.id
      WHERE s.status = '已完成' GROUP BY sc.category
    expect: success

  - id: join_04
    category: 两表JOIN
    question: 花山万达店各DM完成的场次分别是多少?
    gold_sql: >
      SELECT st.name, COUNT(*) FROM sessions s
      JOIN staff st ON s.dm_id = st.id
      JOIN stores sto ON s.store_id = sto.id
      WHERE s.status = '已完成' AND sto.name = '花山万达店'
      GROUP BY st.name
    expect: success

  - id: join_05
    category: 两表JOIN
    question: 各门店的员工人数分别是多少(含离职)?
    gold_sql: >
      SELECT st.name, COUNT(*) FROM staff s
      JOIN stores st ON s.store_id = st.id GROUP BY st.name
    expect: success

  - id: join_06
    category: 两表JOIN
    question: 各门店的已完成场次数分别是多少?
    gold_sql: >
      SELECT st.name, COUNT(*) FROM sessions s
      JOIN stores st ON s.store_id = st.id
      WHERE s.status = '已完成' GROUP BY st.name
    expect: success

  - id: join_07
    category: 三表JOIN
    question: 各会员等级的玩家总消费金额分别是多少?
    gold_sql: >
      SELECT p.member_level, ROUND(SUM(sp.price_paid), 2)
      FROM session_players sp
      JOIN players p ON sp.player_id = p.id
      JOIN sessions s ON sp.session_id = s.id
      WHERE s.status = '已完成' GROUP BY p.member_level
    expect: success

  - id: join_08
    category: 三表JOIN
    question: 各门店的新玩家到场人次分别是多少?
    gold_sql: >
      SELECT st.name, COUNT(*) FROM session_players sp
      JOIN sessions s ON sp.session_id = s.id
      JOIN stores st ON s.store_id = st.id
      WHERE sp.is_new = 1 AND s.status = '已完成' GROUP BY st.name
    expect: success

  - id: join_09
    category: 两表JOIN
    question: 各购票渠道的消费金额分别是多少?
    gold_sql: >
      SELECT sp.channel, ROUND(SUM(sp.price_paid), 2)
      FROM session_players sp JOIN sessions s ON sp.session_id = s.id
      WHERE s.status = '已完成' GROUP BY sp.channel
    expect: success

  - id: join_10
    category: 两表JOIN
    question: 各门店的场均人数是多少?
    gold_sql: >
      SELECT st.name, ROUND(AVG(s.player_count), 2) FROM sessions s
      JOIN stores st ON s.store_id = st.id
      WHERE s.status = '已完成' GROUP BY st.name
    expect: success

  - id: join_11
    category: 两表JOIN
    question: 各剧本类型的场均人数是多少?
    gold_sql: >
      SELECT sc.category, ROUND(AVG(s.player_count), 2) FROM sessions s
      JOIN scripts sc ON s.script_id = sc.id
      WHERE s.status = '已完成' GROUP BY sc.category
    expect: success

  - id: join_12
    category: 三表JOIN+排序
    question: 雨山金鹰店完成场次最多的剧本是哪个?
    gold_sql: >
      SELECT sc.name FROM sessions s
      JOIN scripts sc ON s.script_id = sc.id
      JOIN stores st ON s.store_id = st.id
      WHERE s.status = '已完成' AND st.name = '雨山金鹰店'
      GROUP BY sc.name ORDER BY COUNT(*) DESC, sc.name LIMIT 1
    expect: success

  # ---------- TopN(8) ----------
  - id: topn_01
    category: TopN
    question: 完成场次最多的前5个剧本是哪些?
    gold_sql: >
      SELECT sc.name, COUNT(*) FROM sessions s
      JOIN scripts sc ON s.script_id = sc.id
      WHERE s.status = '已完成' GROUP BY sc.name
      ORDER BY COUNT(*) DESC, sc.name LIMIT 5
    expect: success

  - id: topn_02
    category: TopN
    question: 营收最高的前5个剧本是哪些?
    gold_sql: >
      SELECT sc.name, ROUND(SUM(s.total_amount), 2) FROM sessions s
      JOIN scripts sc ON s.script_id = sc.id
      WHERE s.status = '已完成' GROUP BY sc.name
      ORDER BY SUM(s.total_amount) DESC, sc.name LIMIT 5
    expect: success

  - id: topn_03
    category: TopN
    question: 完成场次最多的前5名DM是谁?
    gold_sql: >
      SELECT st.name, COUNT(*) FROM sessions s
      JOIN staff st ON s.dm_id = st.id
      WHERE s.status = '已完成' GROUP BY st.name
      ORDER BY COUNT(*) DESC, st.name LIMIT 5
    expect: success

  - id: topn_04
    category: TopN
    question: 消费总额最高的前5名玩家是谁?
    gold_sql: >
      SELECT p.nickname, ROUND(SUM(sp.price_paid), 2)
      FROM session_players sp JOIN players p ON sp.player_id = p.id
      JOIN sessions s ON sp.session_id = s.id
      WHERE s.status = '已完成' GROUP BY p.nickname
      ORDER BY SUM(sp.price_paid) DESC, p.nickname LIMIT 5
    expect: success

  - id: topn_05
    category: TopN
    question: 2026年6月营收最高的前3家门店是哪些?
    gold_sql: >
      SELECT st.name, ROUND(SUM(s.total_amount), 2) FROM sessions s
      JOIN stores st ON s.store_id = st.id
      WHERE s.status = '已完成' AND s.session_date >= '2026-06-01' AND s.session_date < '2026-07-01'
      GROUP BY st.name ORDER BY SUM(s.total_amount) DESC, st.name LIMIT 3
    expect: success

  - id: topn_06
    category: TopN
    question: 2026年6月完成场次最多的前5个剧本是哪些?
    gold_sql: >
      SELECT sc.name, COUNT(*) FROM sessions s
      JOIN scripts sc ON s.script_id = sc.id
      WHERE s.status = '已完成' AND s.session_date >= '2026-06-01' AND s.session_date < '2026-07-01'
      GROUP BY sc.name ORDER BY COUNT(*) DESC, sc.name LIMIT 5
    expect: success

  - id: topn_07
    category: TopN
    question: 到场次数最多的前5名玩家是谁?
    gold_sql: >
      SELECT p.nickname, COUNT(*) FROM session_players sp
      JOIN players p ON sp.player_id = p.id
      JOIN sessions s ON sp.session_id = s.id
      WHERE s.status = '已完成' GROUP BY p.nickname
      ORDER BY COUNT(*) DESC, p.nickname LIMIT 5
    expect: success

  - id: topn_08
    category: TopN
    question: 2026年6月完成场次最多的前5名DM是谁?
    gold_sql: >
      SELECT st.name, COUNT(*) FROM sessions s
      JOIN staff st ON s.dm_id = st.id
      WHERE s.status = '已完成' AND s.session_date >= '2026-06-01' AND s.session_date < '2026-07-01'
      GROUP BY st.name ORDER BY COUNT(*) DESC, st.name LIMIT 5
    expect: success

  # ---------- 口径(6) ----------
  - id: term_01
    category: 口径类
    question: 整体客单价是多少?
    gold_sql: >
      SELECT ROUND(SUM(total_amount) * 1.0 / NULLIF(SUM(player_count), 0), 2)
      FROM sessions WHERE status = '已完成'
    expect: success

  - id: term_02
    category: 口径类
    question: 整体场均人数是多少?
    gold_sql: >
      SELECT ROUND(AVG(player_count), 2) FROM sessions WHERE status = '已完成'
    expect: success

  - id: term_03
    category: 口径类
    question: 整体取消率是多少?
    gold_sql: ""
    expect: success_only

  - id: term_04
    category: 口径类
    question: 复购玩家有多少名?
    gold_sql: >
      SELECT COUNT(*) FROM (
        SELECT sp.player_id FROM session_players sp
        JOIN sessions s ON sp.session_id = s.id
        WHERE s.status = '已完成'
        GROUP BY sp.player_id HAVING COUNT(*) >= 2
      )
    expect: success

  - id: term_05
    category: 口径类
    question: 新玩家到场人次占比是多少?
    gold_sql: ""
    expect: success_only

  - id: term_06
    category: 口径类
    question: 2026年6月花山万达店的目标达成率是多少?
    gold_sql: ""
    expect: success_only

